---
layout: default
---
<div class="pagehead">
  <div class="wrap">
    <div class="eyebrow">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</div>
    <h1>{{ page.title }}</h1>
  </div>
</div>
<main>
  <div class="wrap">
    <article class="prose">
      {{ content }}
      {% if page.tags.size > 0 %}<p style="margin-top:1.6rem">{% for tag in page.tags %}<span class="tag">#{{ tag }}</span> {% endfor %}</p>{% endif %}
    </article>
    <a class="backlink" href="{{ '/' | relative_url }}">← Back to the blog</a>
  </div>
</main>
